<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="50%" stop-color="#0D101A"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121522"/>
      <stop offset="100%" stop-color="#090B12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C058"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A227" flood-opacity="0.25"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" stroke="#1A1E2B" stroke-width="2"/>

  <!-- Top Institutional Header -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#D42535"/>
    <text x="22" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D42535" letter-spacing="1.5">PENN ENTERPRISES LLC · PRODUCTION ARCHITECTURE</text>
    <text x="0" y="38" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F7F2EE">The Lantern Daily: Autonomous Intelligence Newsroom &amp; Live Terminal</text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9CA3AF">
      99.7% Operational Cost Reduction · Event-Driven Ingestion · Gemini 3.8 Flash · Telegram Pocket Remote · Vercel Edge ISR
    </text>
  </g>

  <!-- Live Domain Pill -->
  <g transform="translate(970, 45)">
    <rect width="180" height="34" rx="17" fill="#0A0D18" stroke="#B8922A" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4" fill="#4ADE80"/>
    <text x="32" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#E5C058">thelanterndaily.com</text>
  </g>

  <!-- ==================== LAYER 1: MULTI-SOURCE RADAR ==================== -->
  <g transform="translate(50, 135)">
    <rect width="200" height="230" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#glowCyan)"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#cyanGrad)"/>
    <text x="18" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">LAYER 01: INTAKE</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F7F2EE">Multi-Source Radar</text>
    
    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• 50+ Curated RSS Feeds</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  ArXiv AI, Anthropic, HN</text>
    <text x="18" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• Yahoo Finance API</text>
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  SPUS, HLAL, Gold, Oil</text>
    <text x="18" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• CoinGecko Crypto</text>
    <text x="18" y="182" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Live Bitcoin / PAX-Gold</text>

    <rect x="18" y="200" width="164" height="18" rx="4" fill="#0C2538"/>
    <text x="24" y="213" font-family="monospace" font-size="9" font-weight="700" fill="#38BDF8">INGESTION: &lt; 500ms</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 250 250 L 280 250" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="285,250 277,245 277,255" fill="#38BDF8"/>

  <!-- ==================== LAYER 2: DEDUPLICATION & AI DESK ==================== -->
  <g transform="translate(285, 135)">
    <rect width="215" height="230" rx="12" fill="url(#cardGrad)" stroke="#B8922A" stroke-width="1.5" filter="url(#glowGold)"/>
    <rect x="0" y="0" width="215" height="6" rx="3" fill="url(#goldGrad)"/>
    <text x="18" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#E5C058" letter-spacing="1">LAYER 02: EDITORIAL</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F7F2EE">AI Editorial Board</text>

    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• 2-Stage Deduplication</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  MD5 Hash + 1536d Cosine</text>
    <text x="18" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• Gemini 3.8 Flash</text>
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Pydantic JSON Strict Mode</text>
    <text x="18" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• 5 Maqasid Ethics Pillars</text>
    <text x="18" y="182" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Faith, Life, Mind, Wealth</text>

    <rect x="18" y="200" width="179" height="18" rx="4" fill="#2E2308"/>
    <text x="24" y="213" font-family="monospace" font-size="9" font-weight="700" fill="#E5C058">STANCE: POSITIVE/CRITICAL</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 500 250 L 530 250" stroke="#B8922A" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="535,250 527,245 527,255" fill="#B8922A"/>

  <!-- ==================== LAYER 3: SOVEREIGN HITL GATE ==================== -->
  <g transform="translate(535, 135)">
    <rect width="200" height="230" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#redGrad)"/>
    <text x="18" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#F87171" letter-spacing="1">LAYER 03: GOVERNANCE</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F7F2EE">Sovereign HITL Gate</text>

    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• CEO Pocket Remote</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Telegram Bot Push</text>
    <text x="18" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• 1-Tap Mobile Dispatch</text>
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  [Approve] / [Reject]</text>
    <text x="18" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• Slack Ops-Intel Router</text>
    <text x="18" y="182" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Audit Trail to #pe-ops-intel</text>

    <rect x="18" y="200" width="164" height="18" rx="4" fill="#2E0E11"/>
    <text x="24" y="213" font-family="monospace" font-size="9" font-weight="700" fill="#F87171">ZERO UNVETTED POSTS</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 735 250 L 765 250" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="770,250 762,245 762,255" fill="#EF4444"/>

  <!-- ==================== LAYER 4: STATE STORE & SECURITY ==================== -->
