    <rect width="180" height="230" rx="12" fill="url(#cardGrad)" stroke="#4ADE80" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="6" rx="3" fill="url(#greenGrad)"/>
    <text x="18" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#4ADE80" letter-spacing="1">LAYER 04: STORAGE</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F7F2EE">Supabase State</text>

    <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• PostgreSQL Relational</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  signals, posts, sources</text>
    <text x="18" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• 100% RLS Isolation</text>
    <text x="18" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Service Role Protection</text>
    <text x="18" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• State Transition</text>
    <text x="18" y="182" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  'draft' to 'published'</text>

    <rect x="18" y="200" width="144" height="18" rx="4" fill="#0E2E1B"/>
    <text x="24" y="213" font-family="monospace" font-size="9" font-weight="700" fill="#4ADE80">RLS PUBLIC READ: ACTIVE</text>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <path d="M 950 250 L 980 250" stroke="#4ADE80" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="985,250 977,245 977,255" fill="#4ADE80"/>

  <!-- ==================== LAYER 5: RESILIENT EDGE DELIVERY ==================== -->
  <g transform="translate(985, 135)">
    <rect width="165" height="230" rx="12" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="6" rx="3" fill="url(#purpleGrad)"/>
    <text x="16" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#C084FC" letter-spacing="1">LAYER 05: EDGE</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F7F2EE">Next.js 15 Vercel</text>

    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• App Router SSR</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  12-Column Console</text>
    <text x="16" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• ISR Edge Caching</text>
    <text x="16" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Markets (3600s), Posts (60s)</text>
    <text x="16" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#CBD5E1">• SWR Zero-Downtime</text>
    <text x="16" y="182" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">  Graceful API Fallbacks</text>

    <rect x="16" y="200" width="133" height="18" rx="4" fill="#2A103D"/>
    <text x="22" y="213" font-family="monospace" font-size="9" font-weight="700" fill="#C084FC">SPEED: &lt; 100ms P99</text>
  </g>

  <!-- ==================== LOWER PERFORMANCE & ROI KPI CARDS ==================== -->
  <g transform="translate(50, 400)">
    <!-- Box 1: Agency vs Stack -->
    <rect width="260" height="120" rx="8" fill="#0A0C14" stroke="#1E2433"/>
    <text x="20" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">INITIAL CAPITAL OUTLAY</text>
    <text x="20" y="62" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#4ADE80">$0 Capital Debt</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Traditional Agency Quote: $55K - $83K</text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">100% Owned In-House Architecture</text>
  </g>

  <g transform="translate(330, 400)">
    <!-- Box 2: Operating Overhead -->
    <rect width="260" height="120" rx="8" fill="#0A0C14" stroke="#1E2433"/>
    <text x="20" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">ANNUAL OPERATING OVERHEAD</text>
    <text x="20" y="62" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#38BDF8">&lt; $300 / Year</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Human Newsroom Baseline: $192,000/yr</text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">99.7% Operational Cost Reduction</text>
  </g>

  <g transform="translate(610, 400)">
    <!-- Box 3: Publishing Velocity -->
    <rect width="260" height="120" rx="8" fill="#0A0C14" stroke="#1E2433"/>
    <text x="20" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">END-TO-END VELOCITY</text>
    <text x="20" y="62" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#E5C058">&lt; 60 Seconds</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Wire Ingestion to Staged Mobile Card</text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">Manual Baseline: 4.5 Hours per Edition</text>
  </g>

  <g transform="translate(890, 400)">
    <!-- Box 4: Reliability & Uptime -->
    <rect width="260" height="120" rx="8" fill="#0A0C14" stroke="#1E2433"/>
    <text x="20" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">SYSTEM UPTIME &amp; RESILIENCE</text>
    <text x="20" y="62" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#C084FC">100% SWR Guard</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Sub-100ms Edge Latency (P99)</text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">Zero-Downtime Deterministic Fallback</text>
  </g>

  <!-- Bottom Regulatory & Legal Strip -->
  <g transform="translate(50, 560)">
    <rect width="1100" height="75" rx="8" fill="#080A10" stroke="#141824"/>
    <text x="24" y="25" font-family="monospace" font-size="10" font-weight="700" fill="#B8922A">ENTERPRISE TECHNICAL DEFENSE SCRIPT</text>
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#D1D5DB">
      "Architecturally, The Lantern Daily is an event-driven, decoupled intelligence pipeline: automated daemons ingest wire feeds, Gemini 3.8 Flash evaluates
    </text>
    <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#D1D5DB">
      Maqasid ethical compliance with Pydantic JSON schemas, Keymon reviews via Telegram 1-tap mobile push, and Next.js 15 renders live edge ISR with zero downtime."
    </text>
  </g>
</svg>
