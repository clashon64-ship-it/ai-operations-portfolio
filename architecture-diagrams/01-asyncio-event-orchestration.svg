<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="0.5">High-Throughput Multi-Node LLM Orchestration Pipeline</text>
  <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Empirically Verified: 31,207+ events/sec | p50: 0.024ms | 100% Failover Resilience | SHA-256 Telemetry</text>

  <!-- Node 1: Ingestion &amp; Event Loop -->
  <g transform="translate(40, 110)">
    <rect width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="250" height="6" rx="3" fill="url(#accentBlue)"/>
    <text x="20" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-transform="uppercase">Node 01: Ingestion</text>
    <text x="20" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Asyncio Event Loop</text>
    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1">• epoll/kqueue Non-blocking I/O</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Semaphore Concurrency: 25</text>
    <text x="20" y="120" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Malformed Payload Trapping</text>
    <rect x="20" y="130" width="70" height="14" rx="3" fill="#0369a1"/>
    <text x="25" y="141" font-family="sans-serif" font-size="9" font-weight="600" fill="#e0f2fe">p50: 0.024ms</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 290 185 L 340 185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="345,185 337,180 337,190" fill="#38bdf8"/>

  <!-- Node 2: Evaluation &amp; Routing -->
  <g transform="translate(350, 110)">
    <rect width="260" height="150" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#accentGreen)"/>
    <text x="20" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-transform="uppercase">Node 02: Evaluation</text>
    <text x="20" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">LLM-as-Judge &amp; Rules</text>
    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 5-Criterion Weighted Rubric</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Quality Threshold: > 8.5 / 10</text>
    <text x="20" y="120" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Negative Prompt Safeguards</text>
    <rect x="20" y="130" width="80" height="14" rx="3" fill="#065f46"/>
    <text x="25" y="141" font-family="sans-serif" font-size="9" font-weight="600" fill="#d1fae5">Zero Drift</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 610 185 L 660 185" stroke="#34d399" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="665,185 657,180 657,190" fill="#34d399"/>

  <!-- Node 3: Execution &amp; Audit -->
  <g transform="translate(670, 110)">
    <rect width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="6" rx="3" fill="url(#accentAmber)"/>
    <text x="20" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-transform="uppercase">Node 03: Telemetry</text>
    <text x="20" y="55" font-family="sans-serif" font-size="14" font-weight="600" fill="#f8fafc">SHA-256 Digest Audit</text>
    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Cryptographic Execution Hash</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Automated Human Gate Alert</text>
    <text x="20" y="120" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Immutable Audit Trail Log</text>
    <rect x="20" y="130" width="95" height="14" rx="3" fill="#78350f"/>
    <text x="25" y="141" font-family="sans-serif" font-size="9" font-weight="600" fill="#fef3c7">Deterministic</text>
  </g>

  <!-- Lower Layer: System Invariants &amp; Benchmarks -->
  <g transform="translate(40, 290)">
    <rect width="880" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Production Invariants &amp; Resilience Telemetry</text>
    
    <g transform="translate(25, 55)">
      <rect width="260" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Fail-Closed Safety</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#94a3b8">Unvalidated payloads halt immediately.</text>
      <text x="15" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8">Zero unverified external API dispatch.</text>
    </g>

    <g transform="translate(310, 55)">
      <rect width="260" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">Sub-Millisecond Execution</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#94a3b8">Peak Throughput: 31,207+ events/sec</text>
      <text x="15" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8">Median latency: 0.024ms (Mac / Linux)</text>
    </g>

    <g transform="translate(595, 55)">
      <rect width="260" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24">Human-in-the-Loop Gate</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#94a3b8">Slack triage triggers for scores &lt; 8.5</text>
      <text x="15" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8">One-click human approval boundary</text>
    </g>
  </g>
</svg>
