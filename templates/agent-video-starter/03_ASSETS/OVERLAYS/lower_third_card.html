<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 0; background: transparent; display: flex; align-items: flex-end; justify-content: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lower-third { width: 900px; background: rgba(15, 23, 42, 0.90); border: 2px solid #38BDF8; border-radius: 16px; padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 240px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .info { display: flex; flex-direction: column; gap: 4px; }
    .name { font-size: 32px; font-weight: 800; color: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; }
    .role { font-size: 20px; font-weight: 700; color: #38BDF8; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge { background: #38BDF8; color: #0F172A; padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="lower-third">
    <div class="info">
      <div class="name">Derrick McCullough</div>
      <div class="role">Creator & Operating Partner</div>
    </div>
    <div class="badge">AI OPS</div>
  </div>
</body>
</html>
